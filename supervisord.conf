[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:xvfb]
command=Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -ac +extension GLX +render -noreset
autorestart=true
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=openbox --config-file /home/signal/.config/openbox/rc.xml
user=signal
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/signal"
autorestart=true
priority=200
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=bash -c "x11vnc -display %(ENV_DISPLAY)s -forever -shared -nopw %(ENV_VNC_AUTH)s -xkb -noxrecord -noxfixes -noxdamage -rfbport %(ENV_VNC_PORT)s -wait 5"
autorestart=true
priority=300
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/opt/noVNC/utils/novnc_proxy --vnc localhost:%(ENV_VNC_PORT)s --listen %(ENV_NOVNC_PORT)s
autorestart=true
priority=400
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:signal]
command=signal-desktop --no-sandbox --disable-gpu
user=signal
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/signal",DBUS_SESSION_BUS_ADDRESS="autolaunch:"
autorestart=true
priority=500
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
